<meta name="theme-color" content="#000000">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14181f;--sub:#6b7480;--line:#dde2e8;--acc:#3d3be0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e9edf2;--sub:#8b95a3;--line:#262c36;--acc:#8b8aff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--card);border-radius:14px;margin-bottom:14px;overflow:hidden;border:1px solid var(--line)}
.card img{display:block;width:100%;background:var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.ft{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--sub);font-size:13px}
.av{border-radius:50%;object-fit:cover;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.box h2,.box h3{margin:0}
.prof{align-items:center;text-align:center}
input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;background:var(--acc);color:#fff;cursor:pointer;width:100%}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.lnk{background:none;border:0;color:var(--sub);font:inherit;cursor:pointer;padding:4px}
.sub{color:var(--sub);margin:0;white-space:pre-wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;background:var(--line);border-radius:4px}
.pv{max-width:100%;border-radius:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;max-width:160px;font:inherit;font-weight:700;background:none;border:0;padding:10px;border-radius:10px;color:var(--sub);cursor:pointer}
nav button.on{color:var(--acc);background:var(--bg)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;padding:16px}
.zoom img{max-width:100%;max-height:78vh;border-radius:8px}
.zoom .btn{width:auto;padding:10px 22px;background:#c62828}
.c{text-align:center}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;justify-content:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
header img{width:30px;height:30px;border-radius:8px}
header b{font-size:18px;letter-spacing:.02em}
.logo{width:150px;height:150px;border-radius:28px;align-self:center}
</style>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,query,orderBy,limit,where,getDocs,onSnapshot,runTransaction,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB95hJb_YWCn_AiR_qScSYKMvwYN7BJGsU",
  authDomain: "mozya-bf314.firebaseapp.com",
  projectId: "mozya-bf314",
  storageBucket: "mozya-bf314.firebasestorage.app",
  messagingSenderId: "115684072662",
  appId: "1:115684072662:web:1dd02d698b5bd125ec3d77",
  measurementId: "G-FYS15KSSJK"
};
const KEEP = 100;               // 残す投稿数
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb), db = getFirestore(fb);

const $ = s => document.querySelector(s);
const el = (t, a = {}, ...c) => {
  const e = document.createElement(t);
  for (const k in a) k === 'class' ? e.className = a[k] : k.startsWith('on') ? e[k] = a[k] : e.setAttribute(k, a[k]);
  c.flat().forEach(x => e.append(x));
  return e;
};
const app = $('#app'), nav = $('#nav'), top_ = $('#top');
let me = null, unsub = null, shown = 20;

/* ---------- utils ---------- */
const NONAME = {name: '名無し', bio: '', avatar: ''};
const uc = {};
const getUser = uid => uc[uid] ??= getDoc(doc(db, 'users', uid)).then(s => s.exists() ? s.data() : NONAME).catch(() => NONAME);

function av(u, size) {
  const s = `width:${size}px;height:${size}px;font-size:${size * .42}px`;
  return u.avatar
    ? el('img', {class: 'av', src: u.avatar, style: s})
    : el('div', {class: 'av', style: s}, (u.name || '?').slice(0, 1));
}

function shrink(file, max, q = .6) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => {
      const r = Math.min(1, max / Math.max(i.width, i.height));
      const c = document.createElement('canvas');
      c.width = Math.round(i.width * r); c.height = Math.round(i.height * r);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      let o = c.toDataURL('image/jpeg', q);
      while (o.length > 280000 && q > .2) { q -= .1; o = c.toDataURL('image/jpeg', q); }
      res(o);
    };
    i.onerror = rej;
    i.src = URL.createObjectURL(file);
  });
}

/* ---------- routing ---------- */
function go(v, arg) {
  if (unsub) { unsub(); unsub = null; }
  app.replaceChildren();
  const tab = v === 'profile' && arg === me?.uid ? 'me' : v;
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === tab));
  ({home, post: postView, me: () => profile(me.uid), profile, edit: editProfile}[v])(arg);
  scrollTo(0, 0);
}
nav.onclick = e => {
  const v = e.target.dataset?.v;
  if (v) { shown = 20; go(v); }
};

onAuthStateChanged(auth, u => {
  if (!u) { me = null; showAuth(); return; }
  me = {uid: u.uid};
  nav.hidden = false; top_.hidden = false;
  go('home');
});

/* ---------- auth ---------- */
function showAuth() {
  nav.hidden = true; top_.hidden = true;
  app.replaceChildren();
  let signup = false;
  const name = el('input', {placeholder: 'ユーザー名', maxlength: 20});
  const em = el('input', {type: 'email', placeholder: 'メールアドレス', autocomplete: 'email'});
  const pw = el('input', {type: 'password', placeholder: 'パスワード(6文字以上)', autocomplete: 'current-password'});
  const ok = el('button', {class: 'btn'}), sw = el('button', {class: 'lnk'});
  const upd = () => {
    name.hidden = !signup;
    ok.textContent = signup ? '登録する' : 'ログイン';
    sw.textContent = signup ? 'ログインはこちら' : 'アカウントを作る';
  };
  sw.onclick = () => { signup = !signup; upd(); };
  ok.onclick = async () => {
    ok.disabled = true;
    try {
      if (signup) {
        const c = await createUserWithEmailAndPassword(auth, em.value, pw.value);
        await setDoc(doc(db, 'users', c.user.uid), {name: name.value.trim().slice(0, 20) || '名無し', bio: '', avatar: ''});
        delete uc[c.user.uid];
      } else await signInWithEmailAndPassword(auth, em.value, pw.value);
    } catch (e) {
      const m = {'auth/invalid-credential': 'メールかパスワードが違います', 'auth/email-already-in-use': 'このメールは登録済みです', 'auth/weak-password': 'パスワードは6文字以上にしてください', 'auth/invalid-email': 'メールアドレスの形式が正しくありません', 'auth/operation-not-allowed': 'Firebaseでメール/パスワード認証を有効にしてください'};
      alert(m[e.code] || e.code);
    }
    ok.disabled = false;
  };
  upd();

/* ---------- home ---------- */
function card(d, u) {
  const p = d.data(), t = p.createdAt?.toDate?.();
  return el('div', {class: 'card'},
    el('div', {class: 'hd', onclick: () => go('profile', p.uid)}, av(u, 34), el('b', {}, u.name)),
    el('img', {src: p.image, loading: 'lazy'}),
    el('div', {class: 'ft'},
      el('span', {}, t ? t.toLocaleString('ja-JP', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'}) : '送信中…'),
      p.uid === me.uid ? el('button', {class: 'lnk', onclick: () => confirm('この投稿を削除しますか？') && deleteDoc(d.ref)}, '削除') : ''));
}

function home() {
  const list = el('div');
  const more = el('button', {class: 'btn ghost', hidden: true, onclick: () => { shown += 20; go('home'); }}, 'もっと見る');
  app.append(list, more);
  unsub = onSnapshot(query(collection(db, 'posts'), orderBy('seq', 'desc'), limit(shown)), async s => {
    const items = await Promise.all(s.docs.map(async d => card(d, await getUser(d.data().uid))));
    list.replaceChildren(...items);
    if (!items.length) list.append(el('p', {class: 'sub c'}, 'まだ投稿がありません。最初の1枚を投稿しましょう。'));
    more.hidden = s.size < shown;
  }, e => alert('読み込みエラー: ' + e.code));
}

/* ---------- post ---------- */
async function doPost(image) {
  const cref = doc(db, 'meta', 'counter');
  return runTransaction(db, async tx => {
    const s = await tx.get(cref);
    const n = (s.exists() ? s.data().n : 0) + 1;
    tx.set(cref, {n});
    tx.set(doc(collection(db, 'posts')), {uid: me.uid, image, seq: n, createdAt: serverTimestamp()});
    return n;
  });
}
// 最新KEEP件より古い投稿を削除(ルール側でも最新KEEP件は消せない)
async function cleanup(n) {
  if (n <= KEEP) return;
  const s = await getDocs(query(collection(db, 'posts'), where('seq', '<=', n - KEEP)));
  s.forEach(d => deleteDoc(d.ref).catch(() => {}));
}

function postView() {
  let data = null;
  const pv = el('img', {class: 'pv'});
  const btn = el('button', {class: 'btn', disabled: ''}, '投稿する');
  const inp = el('input', {type: 'file', accept: 'image/*', onchange: async e => {
    const f = e.target.files[0];
    if (!f) return;
    data = await shrink(f, 720);
    pv.src = data;
    btn.disabled = false;
  }});
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = '投稿中…';
    try { const n = await doPost(data); cleanup(n); go('home'); }
    catch (e) { alert('投稿に失敗しました: ' + (e.code || e.message)); btn.disabled = false; btn.textContent = '投稿する'; }
  };
  app.append(el('div', {class: 'box'}, el('h3', {}, '画像を投稿'), inp, pv, btn));
}

/* ---------- profile ---------- */
function zoom(d) {
  const p = d.data();
  const o = el('div', {class: 'zoom', onclick: () => o.remove()},
    el('img', {src: p.image}),
    p.uid === me.uid ? el('button', {class: 'btn', onclick: async e => {
      e.stopPropagation();
      if (confirm('この投稿を削除しますか？')) { await deleteDoc(d.ref); o.remove(); go('profile', p.uid); }
    }}, '削除') : '');
  document.body.append(o);
}

async function profile(uid) {
  const u = await getUser(uid), mine = uid === me.uid;
  const grid = el('div', {class: 'grid'});
  app.append(
    el('div', {class: 'box prof'}, av(u, 84), el('h2', {}, u.name), el('p', {class: 'sub'}, u.bio || ''),
      mine ? el('div', {style: 'display:flex;gap:8px;width:100%'},
        el('button', {class: 'btn', onclick: () => go('edit', u)}, '編集'),
        el('button', {class: 'btn ghost', onclick: () => confirm('ログアウトしますか？') && signOut(auth)}, 'ログアウト')) : ''),
    grid);
  const s = await getDocs(query(collection(db, 'posts'), where('uid', '==', uid)));
  const ds = s.docs.sort((a, b) => b.data().seq - a.data().seq);
  if (!ds.length) { grid.replaceWith(el('p', {class: 'sub c'}, 'まだ投稿がありません')); return; }
  grid.append(...ds.map(d => el('img', {src: d.data().image, loading: 'lazy', onclick: () => zoom(d)})));
}

function editProfile(u) {
  let avatar = u.avatar || '';
  const name = el('input', {value: u.name, maxlength: 20, placeholder: 'ユーザー名'});
  const bio = el('textarea', {rows: 3, maxlength: 150, placeholder: '自己紹介(150文字まで)'});
  bio.value = u.bio || '';
  const pv = el('div', {}, av({...u, avatar}, 84));
  const file = el('input', {type: 'file', accept: 'image/*', onchange: async e => {
    const f = e.target.files[0];
    if (!f) return;
    avatar = await shrink(f, 160, .7);
    pv.replaceChildren(av({name: name.value, avatar}, 84));
  }});
  const save = el('button', {class: 'btn', onclick: async () => {
    save.disabled = true;
    try {
      await setDoc(doc(db, 'users', me.uid), {name: name.value.trim().slice(0, 20) || '名無し', bio: bio.value.slice(0, 150), avatar});
      delete uc[me.uid];
      go('me');
    } catch (e) { alert('保存に失敗しました: ' + e.code); save.disabled = false; }
  }}, '保存する');
  app.append(el('div', {class: 'box prof'}, el('h3', {}, 'プロフィール編集'), pv, file, name, bio, save,
    el('button', {class: 'btn ghost', onclick: () => go('me')}, 'キャンセル')));
}
