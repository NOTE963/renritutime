<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>連立方程式 タイムアタック</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background: #0d1a26;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app {
      max-width: 760px;
      width: 100%;
      background: #162b3b;
      border-radius: 28px;
      padding: 24px 20px 28px;
      box-shadow: 0 16px 30px -8px rgba(0, 0, 0, 0.8);
      border: 1px solid #2f4a5e;
    }
    .tabs {
      display: flex;
      gap: 4px;
      background: #0f1e2b;
      padding: 6px 8px;
      border-radius: 40px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      border: none;
      background: transparent;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #8aadc2;
      cursor: pointer;
      transition: 0.15s;
      min-width: 60px;
    }
    .tab-btn.active {
      background: #2a4a60;
      color: #f0f9ff;
    }
    .tab-btn:hover:not(.active) {
      background: #1f384b;
      color: #c5dceb;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f1e2b;
      border-radius: 40px;
      padding: 8px 16px;
      margin-bottom: 14px;
      color: #c8dce8;
      flex-wrap: wrap;
      gap: 6px;
    }
    .timer {
      font-size: 2.0rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      background: #0b1723;
      padding: 0 16px;
      border-radius: 30px;
      color: #b3e4ff;
      letter-spacing: 1px;
    }
    .status-msg {
      background: #1a3343;
      padding: 4px 16px;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.85rem;
    }
    .eq-panel {
      background: #0f1e2b;
      border-radius: 24px;
      padding: 18px 10px;
      margin: 6px 0 16px;
      border: 1px solid #2d4a5e;
    }
    .eq-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px 14px;
      flex-wrap: wrap;
      font-size: 1.5rem;
      color: #e6f2fa;
      font-weight: 500;
      padding: 4px 0;
    }
    .eq-row span {
      background: #162b3a;
      padding: 0 14px;
      border-radius: 24px;
      min-width: 44px;
      text-align: center;
      border: 1px solid #2f5066;
    }
    .input-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px 24px;
      margin: 14px 0 10px;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f1e2b;
      padding: 2px 14px 2px 18px;
      border-radius: 40px;
      border: 1px solid #2f4a5e;
    }
    .input-group label {
      color: #b2d3e8;
      font-weight: 600;
      font-size: 1.1rem;
    }
    .input-group input {
      background: #162b3a;
      border: none;
      padding: 8px 4px;
      width: 72px;
      border-radius: 24px;
      color: white;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      outline: 1px solid transparent;
    }
    .input-group input:focus {
      outline: 1px solid #5a9ec9;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 10px 0 8px;
    }
    .btn {
      background: #1f465e;
      border: none;
      border-bottom: 4px solid #0f2a3b;
      padding: 12px 24px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #f2fcff;
      cursor: pointer;
      transition: 0.06s ease;
      box-shadow: 0 5px 0 #0b1e2b;
      flex: 1 0 auto;
      min-width: 90px;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0b1e2b;
    }
    .btn-primary {
      background: #3a7da8;
      border-bottom-color: #1d4d6a;
    }
    .btn-success {
      background: #2a8266;
      border-bottom-color: #18523f;
    }
    .btn-danger {
      background: #b14f4f;
      border-bottom-color: #752f2f;
    }
    .btn-warning {
      background: #c97d2b;
      border-bottom-color: #8a5518;
    }
    .btn-secondary {
      background: #4a6a7a;
      border-bottom-color: #2a4a5a;
    }
    .btn:disabled {
      opacity: 0.4;
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0b1e2b;
      pointer-events: none;
    }
    .toast {
      background: #1a3343;
      padding: 8px 16px;
      border-radius: 30px;
      color: #c7e4f5;
      text-align: center;
      font-weight: 500;
      border-left: 4px solid #4f9bc9;
      margin: 10px 0 4px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }
    .rank-section {
      background: #0f1e2b;
      border-radius: 24px;
      padding: 14px 12px 16px;
      border: 1px solid #2d4a5e;
      margin-top: 4px;
    }
    .rank-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #c8e0ef;
      font-weight: 600;
      padding: 0 2px 10px 2px;
      border-bottom: 1px solid #234a5e;
      font-size: 0.9rem;
      flex-wrap: wrap;
      gap: 8px;
    }
    .rank-tabs {
      display: flex;
      gap: 4px;
      background: #0f1e2b;
      padding: 4px;
      border-radius: 30px;
      border: 1px solid #234a5e;
      flex-wrap: wrap;
    }
    .rank-tab-btn {
      padding: 4px 12px;
      border: none;
      background: transparent;
      border-radius: 24px;
      color: #8aadc2;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.75rem;
      transition: 0.15s;
    }
    .rank-tab-btn.active {
      background: #2a4a60;
      color: #f0f9ff;
    }
    .rank-tab-btn:hover:not(.active) {
      background: #1f384b;
      color: #c5dceb;
    }
    .rank-list {
      list-style: none;
      margin: 8px 0 0 0;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .rank-list li {
      display: flex;
      justify-content: space-between;
      padding: 8px 14px;
      margin: 3px 0;
      background: #1a3343;
      border-radius: 30px;
      color: #e6f2fa;
      border-left: 4px solid #3d7a9e;
      font-weight: 500;
      font-size: 0.9rem;
      align-items: center;
    }
    .rank-list .rank {
      color: #aacde2;
      font-weight: 700;
      margin-right: 10px;
    }
    .rank-list .time {
      background: #1d4054;
      padding: 0 14px;
      border-radius: 24px;
      font-weight: 600;
      color: #b3e4ff;
      font-size: 0.85rem;
    }
    .empty {
      text-align: center;
      color: #7b9eb3;
      padding: 20px 0;
      font-style: italic;
      justify-content: center !important;
    }
    .settings {
      background: #0f1e2b;
      border-radius: 24px;
      padding: 20px 16px;
      border: 1px solid #2d4a5e;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .setting-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      color: #d6eaf5;
      font-weight: 500;
    }
    .setting-row label {
      min-width: 80px;
      font-size: 0.9rem;
    }
    .setting-row input,
    .setting-row select {
      background: #162b3a;
      border: 1px solid #2f5066;
      padding: 8px 14px;
      border-radius: 24px;
      color: white;
      font-size: 0.9rem;
      outline: none;
      flex: 1;
      min-width: 120px;
    }
    .setting-row input:focus,
    .setting-row select:focus {
      border-color: #5a9ec9;
    }
    .setting-row input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .setting-row .btn {
      flex: 0 1 auto;
      padding: 8px 18px;
      font-size: 0.85rem;
    }
    .name-locked {
      color: #8aacbf;
      font-size: 0.8rem;
      margin-left: 8px;
    }
    .delete-section {
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px solid #2f4a5e;
      display: flex;
      justify-content: flex-end;
    }
    .footer {
      text-align: right;
      color: #5a7d93;
      font-size: 0.65rem;
      margin-top: 10px;
      opacity: 0.5;
    }
    .battle-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f1e2b;
      border-radius: 40px;
      padding: 10px 16px;
      margin-bottom: 12px;
      color: #c8dce8;
      flex-wrap: wrap;
      gap: 6px;
    }
    .battle-score {
      display: flex;
      gap: 20px;
      font-weight: 600;
    }
    .battle-score .score-you {
      color: #7bc9a0;
    }
    .battle-score .score-opponent {
      color: #f5a3a3;
    }
    .battle-round {
      background: #1a3343;
      padding: 2px 16px;
      border-radius: 30px;
      font-weight: 600;
    }
    .battle-opponent {
      background: #1a3343;
      padding: 2px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
    }
    .battle-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 8px 0 10px;
    }
    .sound-control {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #8aacbf;
      font-size: 0.8rem;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .sound-control input[type="range"] {
      width: 80px;
      background: #162b3a;
      accent-color: #5a9ec9;
      cursor: pointer;
    }
    .battle-room-input {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 6px 0;
    }
    .battle-room-input input {
      background: #162b3a;
      border: 1px solid #2f5066;
      padding: 8px 14px;
      border-radius: 24px;
      color: white;
      width: 140px;
      outline: none;
    }
    .battle-room-input input:focus {
      border-color: #5a9ec9;
    }
    .battle-room-input .btn {
      flex: 0 1 auto;
      padding: 8px 18px;
      min-width: 60px;
      font-size: 0.85rem;
    }
    .battle-result {
      background: #1a3343;
      border-radius: 30px;
      padding: 10px 16px;
      margin-top: 8px;
      text-align: center;
      color: #f0f9ff;
      font-weight: 600;
      font-size: 1.0rem;
      border-left: 4px solid #f5a3a3;
    }
    .battle-room-status {
      color: #7b9eb3;
      font-size: 0.75rem;
      min-width: 60px;
    }
    .battle-waiting-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 8px 0;
    }
    @media (max-width: 500px) {
      .app {
        padding: 14px 10px;
      }
      .eq-row {
        font-size: 1.2rem;
        gap: 4px 8px;
      }
      .eq-row span {
        min-width: 34px;
        padding: 0 8px;
      }
      .input-group input {
        width: 60px;
        font-size: 1.0rem;
      }
      .btn {
        font-size: 0.8rem;
        padding: 10px 14px;
        min-width: 70px;
      }
      .timer {
        font-size: 1.6rem;
        padding: 0 10px;
      }
      .rank-tabs {
        flex-wrap: wrap;
      }
      .battle-score {
        gap: 12px;
        font-size: 0.9rem;
      }
      .battle-room-input input {
        width: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- タブ -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="tabChallenge">挑戦</button>
      <button class="tab-btn" data-tab="tabBattle">対戦</button>
      <button class="tab-btn" data-tab="tabRanking">ランキング</button>
      <button class="tab-btn" data-tab="tabSettings">設定</button>
    </div>

    <!-- ===== 挑戦タブ ===== -->
    <div id="tabChallenge" class="tab-content active">
      <div class="status-bar">
        <span class="timer" id="timerDisplay">0.0</span>
        <span class="status-msg" id="statusMessage">待機</span>
      </div>
      <div class="eq-panel">
        <div class="eq-row"><span id="eq1a">?</span>x + <span id="eq1b">?</span>y = <span id="eq1c">?</span></div>
        <div class="eq-row"><span id="eq2a">?</span>x + <span id="eq2b">?</span>y = <span id="eq2c">?</span></div>
      </div>
      <div class="input-area">
        <div class="input-group"><label>x =</label><input type="number" id="inputX" step="any" value="0" /></div>
        <div class="input-group"><label>y =</label><input type="number" id="inputY" step="any" value="0" /></div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="newGameBtn">挑戦</button>
        <button class="btn btn-warning" id="stopBtn">ストップ</button>
        <button class="btn btn-success" id="checkBtn">解答</button>
      </div>
      <div class="sound-control">
        <span>音</span>
        <input type="range" id="volumeSlider" min="0" max="100" value="50" />
        <span id="volumeLabel">50%</span>
        <button class="btn" id="toggleSoundBtn" style="flex:0 1 auto; padding:4px 16px; min-width:60px; font-size:0.8rem;">オン</button>
      </div>
      <div class="toast" id="toastMessage">挑戦ボタンでスタート</div>
    </div>

    <!-- ===== 対戦タブ ===== -->
    <div id="tabBattle" class="tab-content">
      <!-- ステータス表示 -->
      <div class="battle-status">
        <div class="battle-score">
          <span class="score-you">あなた: <span id="yourScore">0</span></span>
          <span class="score-opponent">相手: <span id="opponentScore">0</span></span>
        </div>
        <div class="battle-round">ラウンド <span id="battleRound">0</span>/3</div>
        <div class="battle-opponent" id="opponentNameDisplay">待機中</div>
      </div>

      <!-- ルーム操作エリア (常時表示) -->
      <div class="battle-room-input">
        <span style="color:#8aacbf;">ルームID:</span>
        <input type="text" id="roomIdInput" placeholder="部屋番号" />
        <button class="btn btn-secondary" id="battleJoinBtn">参加</button>
        <button class="btn btn-primary" id="battleCreateBtn">作成</button>
        <button class="btn btn-success" id="battleRandomBtn">ランダム</button>
        <span class="battle-room-status" id="roomStatus">-</span>
      </div>

      <!-- マッチング後の準備エリア (マッチング後に表示) -->
      <div id="battleMatchArea" style="display:none;">
        <div class="battle-waiting-area">
          <button class="btn btn-primary" id="battleReadyBtn">準備OK</button>
          <button class="btn btn-warning" id="battleExitBtn">退出</button>
        </div>
      </div>

      <!-- 問題表示エリア (マッチング＆準備完了後に表示) -->
      <div id="battleQuestionArea" style="display:none;">
        <div class="eq-panel">
          <div class="eq-row"><span id="bEq1a">?</span>x + <span id="bEq1b">?</span>y = <span id="bEq1c">?</span></div>
          <div class="eq-row"><span id="bEq2a">?</span>x + <span id="bEq2b">?</span>y = <span id="bEq2c">?</span></div>
        </div>
        <div class="input-area">
          <div class="input-group"><label>x =</label><input type="number" id="bInputX" step="any" value="0" /></div>
          <div class="input-group"><label>y =</label><input type="number" id="bInputY" step="any" value="0" /></div>
        </div>
        <div class="battle-actions">
          <button class="btn btn-success" id="battleAnswerBtn">解答</button>
        </div>
      </div>

      <!-- 結果表示 -->
      <div class="battle-result" id="battleResult" style="display:none;"></div>
      <div class="toast" id="battleToast">対戦相手を待っています</div>
    </div>

    <!-- ===== ランキングタブ ===== -->
    <div id="tabRanking" class="tab-content">
      <div class="rank-section">
        <div class="rank-header">
          <span>ランキング</span>
          <div class="rank-tabs" id="rankTabContainer">
            <button class="rank-tab-btn active" data-digit="1">1桁</button>
            <button class="rank-tab-btn" data-digit="2">2桁</button>
            <button class="rank-tab-btn" data-digit="3">3桁</button>
            <button class="rank-tab-btn" data-digit="4">4桁</button>
            <button class="rank-tab-btn" data-digit="5">5桁</button>
          </div>
        </div>
        <ul class="rank-list" id="rankingList"><li class="empty">読み込み中...</li></ul>
        <div class="footer">Firebase · 一人1記録 · 桁別</div>
      </div>
    </div>

    <!-- ===== 設定タブ ===== -->
    <div id="tabSettings" class="tab-content">
      <div class="settings">
        <div class="setting-row">
          <label>ユーザー名</label>
          <input type="text" id="usernameInput" placeholder="名無し" maxlength="16" />
          <button class="btn btn-primary" id="saveUsernameBtn" style="flex:0 1 auto; padding:6px 16px;">保存</button>
          <span class="name-locked" id="nameLockStatus"></span>
        </div>
        <div class="setting-row">
          <label>桁数</label>
          <select id="digitSelect">
            <option value="1">1桁</option><option value="2">2桁</option>
            <option value="3" selected>3桁</option>
            <option value="4">4桁</option><option value="5">5桁</option>
          </select>
          <span style="color:#8aacbf; font-size:0.85rem; margin-left:4px;">(1〜5桁)</span>
        </div>
        <div class="setting-row" style="justify-content:space-between; flex-wrap:wrap; gap:12px;">
          <span style="color:#7b9eb3; font-size:0.8rem;">同じ名前は使用できません</span>
          <span style="color:#7b9eb3; font-size:0.8rem;">一人1記録まで</span>
        </div>
        <div class="delete-section">
          <button class="btn btn-danger" id="deleteAccountBtn" style="min-width:140px;">アカウント削除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ============================================================
      //  Firebase 設定
      // ============================================================
      const firebaseConfig = {
        apiKey: "AIzaSyAqe24qeS_gYtMA_gnF_lYNP70keCQcpnA",
        authDomain: "renritu-56ae7.firebaseapp.com",
        databaseURL: "https://renritu-56ae7-default-rtdb.firebaseio.com",
        projectId: "renritu-56ae7",
        storageBucket: "renritu-56ae7.firebasestorage.app",
        messagingSenderId: "327969979771",
        appId: "1:327969979771:web:709a0fc2a281dc495e91de",
        measurementId: "G-VFLGB9QXR3"
      };

      let db = null;
      let rankingRef = null;
      let battleRef = null;
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        rankingRef = db.ref('ranking_v5');
        battleRef = db.ref('battle_rooms');
        console.log('Firebase 接続成功');
      } catch (e) {
        console.warn('Firebase 初期化エラー', e);
      }

      // ============================================================
      //  サウンド
      // ============================================================
      let audioCtx = null;
      let soundEnabled = true;
      let masterVolume = 0.5;
      let bgmRunning = false;
      let bgmPattern = [
        { freq: 523.25, dur: 0.12 }, { freq: 587.33, dur: 0.10 },
        { freq: 659.25, dur: 0.14 }, { freq: 523.25, dur: 0.10 },
        { freq: 587.33, dur: 0.12 }, { freq: 659.25, dur: 0.16 }
      ];
      let bgmIndex = 0;
      let bgmTimeout = null;

      function initAudio() {
        if (!audioCtx) {
          try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playTone(freq, duration, type = 'sine', volume = 0.3) {
        if (!soundEnabled || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(volume * masterVolume, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }

      function playBgmNote() {
        if (!soundEnabled || !bgmRunning) return;
        try {
          const note = bgmPattern[bgmIndex % bgmPattern.length];
          playTone(note.freq, note.dur, 'sine', 0.12);
          bgmIndex++;
          bgmTimeout = setTimeout(playBgmNote, note.dur * 1000 + 80);
        } catch (e) {}
      }

      function startBgm() { if (bgmRunning) return;
        bgmRunning = true;
        bgmIndex = 0;
        if (bgmTimeout) clearTimeout(bgmTimeout);
        playBgmNote(); }

      // ============================================================
      //  問題生成
      // ============================================================
      function generateEquation() {
        const digit = getDigit();
        const maxVal = Math.pow(10, digit) - 1;
        const minVal = digit === 1 ? -9 : -(maxVal);
        let x, y, a1, b1, c1, a2, b2, c2, attempts = 0;
        do {
          x = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          y = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          a1 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          b1 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          a2 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          b2 = Math.floor(Math.random() * (maxVal * 2 + 1)) + minVal;
          c1 = a1 * x + b1 * y;
          c2 = a2 * x + b2 * y;
          attempts++;
        } while ((a1 === 0 && b1 === 0) || (a2 === 0 && b2 === 0) ||
          (a1 === a2 && b1 === b2 && c1 === c2) || attempts < 20 ||
          Math.abs(c1) > 1000000 || Math.abs(c2) > 1000000);
        return { a1, b1, c1, a2, b2, c2, solutionX: x, solutionY: y };
      }

      function displayEquation(eq, isBattle = false) {
        const t = isBattle ?
          { a1: bEq1a, b1: bEq1b, c1: bEq1c, a2: bEq2a, b2: bEq2b, c2: bEq2c } :
          { a1: eq1a, b1: eq1b, c1: eq1c, a2: eq2a, b2: eq2b, c2: eq2c };
        t.a1.textContent = eq.a1;
        t.b1.textContent = eq.b1;
        t.c1.textContent = eq.c1;
        t.a2.textContent = eq.a2;
        t.b2.textContent = eq.b2;
        t.c2.textContent = eq.c2;
      }

      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        startTime = Date.now() - elapsedSeconds * 1000;
        timerInterval = setInterval(() => {
          elapsedSeconds = (Date.now() - startTime) / 1000;
          timerDisplay.textContent = elapsedSeconds.toFixed(1);
        }, 100);
      }

      function stopTimer() { if (timerInterval) { clearInterval(timerInterval);
          timerInterval = null; } }

      function resetTimer() { stopTimer();
        elapsedSeconds = 0;
        timerDisplay.textContent = '0.0'; }

      // ============================================================
      //  挑戦モード
      // ============================================================
      function resetGame() {
        stopTimer();
        resetTimer();
        isGameActive = false;
        isSolved = false;
        checkBtn.disabled = true;
        statusMsg.textContent = '停止';
        statusMsg.style.color = '#f5a3a3';

      function newGame() {
        if (!isNameLocked) { toastMessage('先に設定タブで名前を保存してください'); return; }
        stopTimer();
        resetTimer();
        const eq = generateEquation();
        currentEq = eq;
        displayEquation(eq, false);
        inputX.value = 0;
        inputY.value = 0;
        isSolved = false;
        isGameActive = true;
        statusMsg.textContent = '解答中';
        statusMsg.style.color = '#b3d9f0';
        checkBtn.disabled = false;
        toastMessage('スタート！');
        startTimer();
        playStartSound();
        startBgm();

      function checkAnswer() {
        if (!isGameActive || isSolved) { toastMessage('問題がありません'); return; }
        const x = parseFloat(inputX.value);
        const y = parseFloat(inputY.value);
        if (isNaN(x) || isNaN(y)) { toastMessage('数値を入力'); return; }
        const eps = 0.001;
        const eq = currentEq;
        const ok1 = Math.abs(eq.a1 * x + eq.b1 * y - eq.c1) < eps;
        const ok2 = Math.abs(eq.a2 * x + eq.b2 * y - eq.c2) < eps;
        if (ok1 && ok2) {
          isSolved = true;
          isGameActive = false;
          stopTimer();
          stopBgm();
          const finalTime = parseFloat(timerDisplay.textContent);
          statusMsg.textContent = `正解！ ${finalTime.toFixed(1)}s`;
          statusMsg.style.color = '#8bdaa0';
          checkBtn.disabled = true;
          toastMessage(`正解！ ${finalTime.toFixed(1)}秒`);
          playCorrectSound();
          const name = getUsername();
          const digit = getDigit();
          const existing = allRankingData.find(r => r.username === name);
          if (existing) { toastMessage(`「${name}」は既に使用されています`); return; }
          const entry = { username: name, time: Math.round(finalTime * 10) / 10, digit: digit, timestamp: Date.now() };
          saveRanking(entry);
        } else {
          toastMessage('不正解');
          statusMsg.textContent = '不正解';
          statusMsg.style.color = '#f5a3a3';
          playWrongSound();
        }
      }

        if (rankingRef) { rankingRef.push(entry).catch(() => saveLocal(entry)); } else { saveLocal(entry); }
        allRankingData.push(entry);
        renderRanking();
      }

      function saveLocal(entry) { allRankingData.push(entry);
        localStorage.setItem('rank_v5_all', JSON.stringify(allRankingData));
        renderRanking(); }

      function loadRanking() {
        if (rankingRef) {
          rankingRef.on('value', (snap) => {
            const data = snap.val();
            allRankingData = data ? Object.values(data) : [];
            renderRanking();
          }, () => loadLocal());
        } else { loadLocal(); }
      }

      function loadLocal() {
        try {
          const stored = localStorage.getItem('rank_v5_all');
          allRankingData = stored ? JSON.parse(stored) : [];
        } catch (e) { allRankingData = []; }
        renderRanking();
      }

      function renderRanking() {
        const filtered = allRankingData.filter(item => item.digit === selectedDigit);
        filtered.sort((a, b) => a.time - b.time);
        const top3 = filtered.slice(0, 3);
        rankingList.innerHTML = '';
        if (!top3 || top3.length === 0) {
          rankingList.innerHTML = `<li class="empty">${selectedDigit}桁の記録はまだありません</li>`;
          return;
        }
        top3.forEach((item, i) => {
          const li = document.createElement('li');
          const medal = i === 0 ? '1' : i === 1 ? '2' : '3';
          li.innerHTML =
            `<span><span class="rank">${medal}</span> ${item.username}</span><span class="time">${item.time}s</span>`;
          rankingList.appendChild(li);

      // ルーム作成 (エラーハンドリング強化)
      function createBattleRoom() {
        if (!isNameLocked) { battleToastMsg('先に名前を設定してください'); return; }
        const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
        roomIdInput.value = roomId;
        const username = getUsername();
        battlePlayerId = username;
        const roomData = {
          players: { [username]: { ready: false, score: 0, solved: false } },

          maxRound: 3,
          status: 'waiting',
          equation: null,

              battleRoomId = roomId;
              roomStatus.textContent = `作成: ${roomId}`;

              battleIsMatched = false;
              updateBattleAreas();
              listenBattleRoom(roomId);
            })
            .catch((err) => {
              console.error('作成エラー:', err);
              battleToastMsg('ルーム作成に失敗しました (エラー: ' + err.message + ')');
            });
        } else {
          battleToastMsg('Firebaseに接続されていません');
        }
      }

      // ルーム参加
      function joinBattleRoom() {
        if (!isNameLocked) { battleToastMsg('先に名前を設定してください'); return; }
        const roomId = roomIdInput.value.trim().toUpperCase();
        if (!roomId) { battleToastMsg('ルームIDを入力してください'); return; }
        const username = getUsername();
        battlePlayerId = username;
        if (battleRef) {
          battleRef.child(roomId).once('value')
            .then((snap) => {
              const data = snap.val();
              if (!data) { battleToastMsg('ルームが見つかりません'); return; }
              if (data.players && data.players[username]) { battleToastMsg('この名前は既にルームにいます'); return; }
              if (data.status === 'playing' || data.status === 'finished') {
                battleToastMsg('このルームは既に進行中です');
                return;
              }
              const updates = {};
              updates[`players/${username}`] = { ready: false, score: 0, solved: false };
              return battleRef.child(roomId).update(updates);
            })
            .then(() => {
              battleRoomId = roomId;
              roomStatus.textContent = `参加: ${roomId}`;
              battleToastMsg('ルームに参加しました');
              battleIsMatched = false;
              updateBattleAreas();
              listenBattleRoom(roomId);
            })
            .catch((err) => {
              console.error('参加エラー:', err);
              battleToastMsg('参加に失敗しました (エラー: ' + err.message + ')');
            });
        } else {
          battleToastMsg('Firebaseに接続されていません');
        }
      }

      // ランダムマッチング (エラーハンドリング強化)
      function randomMatch() {
        if (!isNameLocked) { battleToastMsg('先に名前を設定してください'); return; }
        if (battleWaitingForMatch) return;
        battleWaitingForMatch = true;
        battleToastMsg('マッチング中...');
        const username = getUsername();

        battleRef.orderByChild('status').equalTo('waiting').limitToFirst(1).once('value')
          .then((snap) => {
            const data = snap.val();
            let found = false;
            if (data) {
              const keys = Object.keys(data);
              for (let key of keys) {
                const room = data[key];
                const players = room.players || {};
                const usernames = Object.keys(players);
                if (!players[username] && usernames.length < 2) {
                  const updates = {};
                  updates[`players/${username}`] = { ready: false, score: 0, solved: false };
                  return battleRef.child(key).update(updates)
                    .then(() => {
                      battleRoomId = key;
                      roomIdInput.value = key;
                      roomStatus.textContent = `参加: ${key}`;
                      battleToastMsg('マッチング成功！');
                      battleWaitingForMatch = false;
                      battleIsMatched = false;
                      updateBattleAreas();
                      listenBattleRoom(key);
                      found = true;
                    });
                }
              }
            }
            // 見つからなかったら新規作成
            if (!found) {
              const newRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
              roomIdInput.value = newRoomId;
              const roomData = {
                players: { [username]: { ready: false, score: 0, solved: false } },
                round: 0,
                maxRound: 3,
                status: 'waiting',
                equation: null,
                creator: username,
                timestamp: Date.now()
              };
              return battleRef.child(newRoomId).set(roomData)
                .then(() => {
                  battleRoomId = newRoomId;
                  roomStatus.textContent = `作成: ${newRoomId}`;
                  battleToastMsg('ルームを作成しました。相手を待っています');
                  battleWaitingForMatch = false;
                  battleIsMatched = false;
                  updateBattleAreas();
                  listenBattleRoom(newRoomId);
                });
            }
          })
          .catch((err) => {
            console.error('マッチングエラー:', err);
            battleToastMsg('マッチングエラー: ' + err.message);
            battleWaitingForMatch = false;
          });
      }

      function listenBattleRoom(roomId) {
        if (battleListener) battleListener.off();
        battleListener = battleRef.child(roomId);
        battleListener.on('value', (snap) => {
          const data = snap.val();
          if (!data) {
            battleToastMsg('ルームが削除されました');
            exitBattleRoom();
            return;
          }
          const players = data.players || {};
          const usernames = Object.keys(players);
          const username = getUsername();

          const opp = usernames.find(n => n !== username);
          if (opp) {
            battleOpponentName = opp;
            opponentNameDisplay.textContent = opp;
            // マッチング成立
            if (!battleIsMatched && usernames.length === 2) {
              battleIsMatched = true;
              updateBattleAreas();
              battleToastMsg('マッチング完了！ 準備OKを押してください');
            }
          } else {
            battleOpponentName = '';
            opponentNameDisplay.textContent = '待機中';
            battleIsMatched = false;
            updateBattleAreas();
          }

          if (players[username]) battleYourScore = players[username].score || 0;
          if (opp && players[opp]) battleOppScore = players[opp].score || 0;

          battleRound = data.round || 0;
          updateBattleUI();

          if (data.equation) {
            setBattleEquation(data.equation);
            battleIsPlaying = true;
            battleReadyBtn.disabled = true;
            battleQuestionArea.style.display = 'block';
          } else {
            battleIsPlaying = false;
            battleReadyBtn.disabled = false;
            if (battleIsMatched) {
              battleQuestionArea.style.display = 'none';
            }
          }

          // 準備状態の確認
          if (data.status === 'waiting') {
            const allReady = usernames.every(n => players[n] && players[n].ready === true);
            const allExist = usernames.length === 2;
            if (allExist && allReady && data.round < data.maxRound) {
              const eq = generateBattleEquation();
              battleRef.child(roomId).update({
                equation: eq,
                status: 'playing',
                round: data.round + 1
              }).then(() => {
                const resetUpdates = {};
                usernames.forEach(n => { resetUpdates[`players/${n}/solved`] = false; });
                battleRef.child(roomId).update(resetUpdates);
                battleToastMsg(`ラウンド ${data.round + 1} スタート！`);
                playStartSound();
              });
            }
          }

          // 勝敗判定
          if (data.status === 'finished' || data.round >= data.maxRound) {
            battleIsFinished = true;
            let winner = '';
            let maxScore = -1;
            usernames.forEach(n => {
              const s = players[n]?.score || 0;
              if (s > maxScore) { maxScore = s;
                winner = n; }
            });
            if (winner) {
              const isYou = winner === username;
              showBattleResult(`${isYou ? 'あなた' : winner} の勝利！ (${maxScore}点)`);
              battleToastMsg(`対戦終了！ ${winner} の勝利！`);
              battleReadyBtn.disabled = true;
              battleAnswerBtn.disabled = true;
            }
          }

          // 相手が先に解いたら通知
          if (opp && players[opp] && players[opp].solved === true && !players[username]?.solved) {
            if (battleIsPlaying && !battleIsFinished && !battleOppSolved) {
              battleOppSolved = true;
              battleToastMsg(`相手が先に解きました！`);
              playWrongSound();
            }
          }
          if (players[username] && players[username].solved === true) {
            battleMySolved = true;
          }

          // 更新
          updateBattleAreas();
        });
      }

      function setBattleReady() {
        if (!battleRoomId) { battleToastMsg('ルームに参加してください'); return; }
        if (battleIsReady || battleIsPlaying || battleIsFinished) return;
        const username = getUsername();
        battleRef.child(`${battleRoomId}/players/${username}/ready`).set(true)
          .then(() => {
            battleIsReady = true;
            battleReadyBtn.textContent = '準備完了';
            battleReadyBtn.disabled = true;
            battleToastMsg('準備完了！ 相手を待っています');
          })
          .catch((err) => {
            battleToastMsg('準備エラー: ' + err.message);
          });
      }

      function battleAnswer() {
        if (!battleRoomId || !battleIsPlaying || battleIsFinished) {
          battleToastMsg('対戦が開始されていません');
          return;
        }
        const username = getUsername();
        battleRef.child(`${battleRoomId}/players/${username}/solved`).once('value')
          .then((snap) => {
            if (snap.val() === true) { battleToastMsg('既に解答済みです'); return; }
            const x = parseFloat(bInputX.value);
            const y = parseFloat(bInputY.value);
            if (isNaN(x) || isNaN(y)) { battleToastMsg('数値を入力'); return; }
            return battleRef.child(`${battleRoomId}/equation`).once('value')
              .then((eqSnap) => {
                const eq = eqSnap.val();
                if (!eq) { battleToastMsg('問題がありません'); return; }
                const eps = 0.001;
                const ok1 = Math.abs(eq.a1 * x + eq.b1 * y - eq.c1) < eps;
                const ok2 = Math.abs(eq.a2 * x + eq.b2 * y - eq.c2) < eps;
                if (ok1 && ok2) {
                  const updates = {};
                  updates[`players/${username}/solved`] = true;
                  updates[`players/${username}/score`] = (battleYourScore || 0) + 1;
                  return battleRef.child(`${battleRoomId}/players`).once('value')
                    .then((pSnap) => {
                      const players = pSnap.val() || {};
                      const allSolved = Object.keys(players).every(n => players[n]?.solved === true);
                      return battleRef.child(battleRoomId).update(updates)
                        .then(() => {
                          battleToastMsg('正解！ +1点');
                          playCorrectSound();
                          if (allSolved) {
                            battleRef.child(battleRoomId).update({
                              status: 'waiting',
                              equation: null,
                              round: battleRound
                            }).then(() => {
                              const resetUpdates = {};
                              Object.keys(players).forEach(n => { resetUpdates[`players/${n}/ready`] = false; });
                              battleRef.child(battleRoomId).update(resetUpdates);
                              battleIsReady = false;
                              battleReadyBtn.disabled = false;
                              battleReadyBtn.textContent = '準備OK';
                              battleToastMsg('次のラウンドへ');
                            });
                          }
                        });
                    });
                } else {
                  battleToastMsg('不正解');
                  playWrongSound();
                }
              });
          })
          .catch((err) => {
            battleToastMsg('解答エラー: ' + err.message);
          });
      }

      function exitBattleRoom() {
        if (battleListener) { battleListener.off();
          battleListener = null; }
        if (battleRoomId && battleRef) {
          battleRef.child(battleRoomId).once('value')
            .then((snap) => {
              const data = snap.val();
              if (data) {
                const username = getUsername();
                const updates = {};
                updates[`players/${username}`] = null;
                battleRef.child(battleRoomId).update(updates);
              }
            })
            .catch(() => {});
        }
        battleRoomId = null;
        battleIsReady = false;
        battleIsPlaying = false;
        battleIsFinished = false;
        battleYourScore = 0;
        battleOppScore = 0;
        battleRound = 0;
        battleOpponentName = '';
        battleMySolved = false;
        battleOppSolved = false;
        battleWaitingForMatch = false;
        battleIsMatched = false;
        roomStatus.textContent = '-';
        opponentNameDisplay.textContent = '待機中';
        battleResult.style.display = 'none';
        battleResult.textContent = '';
        updateBattleUI();
        bEq1a.textContent = '?';
        bEq1b.textContent = '?';
        bEq1c.textContent = '?';
        bEq2a.textContent = '?';
        bEq2b.textContent = '?';
        bEq2c.textContent = '?';
        battleReadyBtn.disabled = false;
        battleReadyBtn.textContent = '準備OK';
        battleAnswerBtn.disabled = false;
        battleToastMsg('退出しました');
        updateBattleAreas();
        stopBgm();
      }

      // ============================================================
      //  アカウント削除
      // ============================================================
      function deleteAccount() {
        const name = getUsername();
        if (!name || name === '名無し') { toastMessage('先にユーザー名を設定してください'); return; }
        const myEntry = allRankingData.find(r => r.username === name);
        if (!myEntry) { toastMessage(`「${name}」の記録は見つかりません`); return; }
        if (!confirm(`「${name}」のアカウントと全ての記録を削除しますか？`)) return;
        if (rankingRef) {
          rankingRef.once('value')
            .then((snap) => {
              const data = snap.val();
              if (!data) { toastMessage('削除するデータがありません'); return; }
              const updates = {};
              let found = false;
              Object.keys(data).forEach(key => {
                if (data[key].username === name) { updates[key] = null;
                  found = true; }
              });
              if (!found) { toastMessage(`「${name}」の記録は見つかりません`); return; }
              return rankingRef.update(updates);
            })
            .then(() => {
              allRankingData = allRankingData.filter(r => r.username !== name);
              localStorage.setItem('rank_v5_all', JSON.stringify(allRankingData));
              deleteCookie('eq_username');
              deleteCookie('eq_name_locked');
              usernameInput.value = '';
              currentUsername = '';
              isNameLocked = false;
              updateNameLockStatus();
              toastMessage(`「${name}」のアカウントと記録を削除しました`);
              renderRanking();
              resetGame();
              stopBgm();
            })
            .catch(() => toastMessage('削除に失敗しました'));
        } else {
          allRankingData = allRankingData.filter(r => r.username !== name);
          localStorage.setItem('rank_v5_all', JSON.stringify(allRankingData));
          deleteCookie('eq_username');
          deleteCookie('eq_name_locked');
          usernameInput.value = '';
          currentUsername = '';
          isNameLocked = false;
          updateNameLockStatus();
          toastMessage('アカウントと記録を削除しました (ローカル)');
          renderRanking();
          resetGame();
          stopBgm();
        }
      }

      // ============================================================
      //  トースト
      // ============================================================
      function toastMessage(msg) {
        toast.textContent = msg;
        setTimeout(() => { if (toast.textContent === msg) toast.textContent = '挑戦ボタンでスタート'; }, 3000);
      }

      // ============================================================
      //  ランキング桁タブ
      // ============================================================
      rankTabContainer.addEventListener('click', (e) => {
        const btn = e.target.closest('.rank-tab-btn');
        if (!btn) return;
        const digit = parseInt(btn.dataset.digit, 10);
        if (isNaN(digit)) return;
        rankTabContainer.querySelectorAll('.rank-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDigit = digit;
        renderRanking();
      });

      // ============================================================
      //  ユーザー名
      // ============================================================
      function loadUsernameFromCookie() {
        const saved = getCookie('eq_username');
        const locked = getCookie('eq_name_locked');
        if (saved) { usernameInput.value = saved;
          currentUsername = saved; }
        if (locked === 'true') isNameLocked = true;
        updateNameLockStatus();
      }

      saveUsernameBtn.addEventListener('click', () => {
        if (isNameLocked) { toastMessage('名前は一度設定すると変更できません'); return; }
        const name = usernameInput.value.trim();
        if (!name) { toastMessage('名前を入力してください'); return; }
        const exists = allRankingData.some(r => r.username === name);
        if (exists) { toastMessage(`「${name}」は既に使用されています`); return; }
        isNameLocked = true;
        setCookie('eq_username', name);
        setCookie('eq_name_locked', 'true');
        currentUsername = name;
        updateNameLockStatus();
        toastMessage(`ユーザー名: ${name} を保存しました (変更不可)`);
      });

      // ============================================================
      //  サウンド
      // ============================================================
      volumeSlider.addEventListener('input', () => {
        masterVolume = parseInt(volumeSlider.value, 10) / 100;
        volumeLabel.textContent = `${Math.round(masterVolume * 100)}%`;
      });

      toggleSoundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        toggleSoundBtn.textContent = soundEnabled ? 'オン' : 'オフ';
        if (!soundEnabled) stopBgm();
        else { initAudio(); if (isGameActive && !isSolved) startBgm(); }
        toastMessage(soundEnabled ? 'サウンドオン' : 'サウンドオフ');
      });

      // ============================================================
      //  イベント
      // ============================================================
      checkBtn.addEventListener('click', checkAnswer);
      newGameBtn.addEventListener('click', newGame);
      stopBtn.addEventListener('click', resetGame);
      deleteAccountBtn.addEventListener('click', deleteAccount);

      battleCreateBtn.addEventListener('click', createBattleRoom);
      battleJoinBtn.addEventListener('click', joinBattleRoom);
      battleRandomBtn.addEventListener('click', randomMatch);
      battleReadyBtn.addEventListener('click', setBattleReady);
      battleAnswerBtn.addEventListener('click', battleAnswer);
      battleExitBtn.addEventListener('click', exitBattleRoom);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (document.activeElement === inputX || document.activeElement === inputY) checkAnswer();
          if (document.activeElement === bInputX || document.activeElement === bInputY) battleAnswer();
        }
      });

      digitSelect.addEventListener('change', () => { toastMessage(`桁数を ${digitSelect.value} に変更`); });

      // ============================================================
      //  初期化
      // ============================================================
      function init() {
        loadUsernameFromCookie();
        loadRanking();
        isGameActive = false;
        isSolved = false;
        checkBtn.disabled = true;
        statusMsg.textContent = '待機';
        resetTimer();
        updateBattleUI();
        updateBattleAreas();

        document.addEventListener('click', () => {
          if (!audioCtx) { try { audioCtx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
        }, { once: true });
      }

      init();
    })();
  </script>
</body>
</html>
